name: Temporary Darboux environment relay

on:
  push:
    branches: [master]
    paths:
      - 'darboux-transfer-url.txt'
      - '.github/workflows/darboux-transfer.yml'

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download signed test asset
        run: |
          set -euo pipefail
          url=$(head -1 darboux-transfer-url.txt)
          curl -L --fail --retry 3 --output /tmp/darboux-transfer-test.txt "$url"
          grep -qx 'darboux transfer test' /tmp/darboux-transfer-test.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: darboux-transfer-test
          path: /tmp/darboux-transfer-test.txt
          compression-level: 0
          retention-days: 1
      - name: Publish artifact identifier
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          printf '%s\n' "$ARTIFACT_ID" > darboux-transfer-artifact-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add darboux-transfer-artifact-id.txt
          git commit -m 'chore: publish temporary transfer artifact id'
          git push
